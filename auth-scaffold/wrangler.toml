name = "auth-scaffold"
main = "backend/src/index.js"
compatibility_date = "2024-06-01"

[assets]
directory = "app/frontend"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "auth-scaffold"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
