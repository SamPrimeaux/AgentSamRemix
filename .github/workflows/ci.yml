name: AgentSamRemix CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Browser ownership tests
        run: npm run test:browser

      - name: Settings control-plane tests
        run: npm run test:settings

      - name: Retrieval unit tests
        run: npm run test:retrieval

      - name: Retrieval eval harness syntax
        run: node --check scripts/eval-retrieval-v1.mjs

      - name: WEBSITE_ASSETS authority invariant
        run: npm run guard:website-assets

      - name: Frontend root invariant
        run: |
          for forbidden in app/dashboard app/app; do
            if [ -d "$forbidden" ] && find "$forbidden" -type f -print -quit | grep -q .; then
              echo "Vite/browser source root is app/. Do not recreate nested source root: $forbidden"
              find "$forbidden" -type f -print
              exit 1
            fi
          done

      - name: Single credential authority invariant
        run: |
          if grep -R -E "USER_SECRET_ENCRYPTION_KEY|SECRETS_ENCRYPTION_KEY" app/backend --include='*.js' --include='*.ts'; then
            echo "Provider/user credentials must use the canonical VAULT_MASTER_KEY crypto path"
            exit 1
          fi
          for dead in \
            app/backend/src/lib/aiKeyStore.ts \
            app/backend/src/lib/secretsCrypto.ts \
            app/backend/credentials/user-secrets.js \
            app/frontend/components/AiKeySettings.tsx; do
            if [ -e "$dead" ]; then
              echo "Retired credential authority returned: $dead"
              exit 1
            fi
          done

      - name: No donor runtime imports
        run: |
          if grep -R -E "(from|import\()[[:space:]]*['\"][^'\"]*imports/agentsamfast" app/backend --include='*.js' --include='*.ts'; then
            echo "Runtime must not import donor-tree AgentSamFast code"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
