name: AgentSamRemix CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Browser ownership tests
        run: npm run test:browser

      - name: Retrieval unit tests
        run: npm run test:retrieval

      - name: Retrieval eval harness syntax
        run: node --check scripts/eval-retrieval-v1.mjs

      - name: Frontend root invariant
        run: |
          if [ -d app/dashboard ] && find app/dashboard -type f -print -quit | grep -q .; then
            echo "Browser/product implementation belongs under app/frontend, not app/dashboard"
            find app/dashboard -type f -print
            exit 1
          fi

      - name: No donor runtime imports
        run: |
          if grep -R -E "(from|import\()[[:space:]]*['\"][^'\"]*imports/agentsamfast" app/backend --include='*.js' --include='*.ts'; then
            echo "Runtime must not import donor-tree AgentSamFast code"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
