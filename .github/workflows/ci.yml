name: AgentSamRemix CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/retrieval-v1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and refresh lock
        run: npm install --ignore-scripts

      - name: Retrieval unit tests
        run: npm run test:retrieval

      - name: No donor runtime imports
        run: |
          if grep -R -E "(from|import\()[[:space:]]*['\"][^'\"]*imports/agentsamfast" app/backend --include='*.js' --include='*.ts'; then
            echo "Runtime must not import donor-tree AgentSamFast code"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit generated package lock
        if: github.event_name == 'push' && github.ref_name == 'feat/retrieval-v1'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock for pg"
          git push origin HEAD:feat/retrieval-v1
